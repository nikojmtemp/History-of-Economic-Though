[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock"
version = "0.1.0"
description = "Stock — a browser simulation of Smith's four stages."
requires-python = ">=3.12"
dependencies = ["numpy", "pyyaml", "fastapi", "uvicorn[standard]", "pydantic", "websockets"]

[project.optional-dependencies]
exe = ["pyinstaller", "pillow"]  # scripts/build_exe.py; pillow draws the icon (scripts/make_icon.py)

[project.scripts]
stock = "stock.launch:main"  # `stock` on the PATH after `pip install .`: serve + open the browser

[tool.setuptools.packages.find]
# Doc 08: only the `stock` package is installable library code; `tools/`, `params/`,
# `tests/scenarios/` are run in place from a repo checkout (CI's working directory), never
# imported as installed packages.
include = ["stock*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E741 is off deliberately: several MM symbols (O, J, ...) are kept as literal field
# names per Doc 00's "symbols from MM keep their names in code where legal".
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# scripts/ is the PyInstaller build driver, not part of the package or its style contract.
"scripts/*" = ["E501"]
# ui/help.py is a table of tooltip sentences; one entry per line reads better than wrapped prose.
"stock/ui/help.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
