# Default parameters (DD §15; every named constant in MM).
#
# This file intentionally overrides nothing — `Params.load("params/default.yaml")`
# must equal `Params.default()` (Doc 01 acceptance). Every field and its default
# lives in stock/core/params.py, grouped by section, with a symbol -> field mapping
# in SYMBOL_MAP. Scenario files override this via their own `params_override` block
# using the same nested shape (see tests/scenarios/three_bands.yaml for an example).
#
# Changelog
