# Doc 07/08 hegemony acceptance ("scenarios/late_start.yaml (nations pre-built at
# different sizes) reaches game over with two distinct winners"): the same 24-location
# map as three_bands_ai.yaml, but the three bands start at very different sizes rather
# than roughly even ones. The loader (sim/scenario.py) only supports seeding a band's
# starting HUNTERS size, not a fully pre-built State — "pre-built at different sizes"
# is approximated here as a large starting-size gap (900 against 90 and 90). Hegemony
# flags only count once two living nations hold a seat beyond BAND (meta/hegemony.py,
# DEVIATIONS-IN-PROGRESS.md A69), so the gap has to be big enough that the valley still
# holds ≥ 0.75 of two world shares for 25 years *after* its rivals have tamed their
# herds (about year 15): measured game over at year 39 with distinct winners. See
# build/DEVIATIONS-IN-PROGRESS.md for this reading of the acceptance line.
