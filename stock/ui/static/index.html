<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" />
<link rel="stylesheet" href="/tokens.css" />
<style>
  #app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-rows: 56px 1fr 40px;
    height: 100vh;
    width: 100vw;
    min-width: 1280px;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  #header {
    display: grid;
    grid-template-columns: auto auto 1fr auto auto;
    align-items: center;
    gap: 22px;
    padding: 0 16px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper-2);
  }
  #year-block { display: flex; align-items: baseline; gap: 10px; }
  #year { font-family: var(--serif); font-size: 28px; line-height: 1; min-width: 56px; }
  #year-label { font-size: 11px; color: var(--ink-2); }
  #player-block { display: flex; flex-direction: column; line-height: 1.2; border-left: 1px solid var(--rule); padding-left: 14px; }
  #player-name { font-family: var(--serif); font-size: 15px; }
  #player-seat { font-size: 11px; color: var(--ink-2); }
  #turn { display: inline-flex; align-items: baseline; gap: 8px; padding: 4px 12px; font-size: 13px; border-color: var(--accent); }
  #turn .glyph { color: var(--accent); }
  #turn .hint { color: var(--ink-2); font-size: 11px; }
  /* clock speed controls (kept for later) */
  #clock { display: flex; gap: 2px; }
  #clock button { min-width: 34px; padding: 2px 6px; font-size: 13px; line-height: 1.4; }
  #headline { display: flex; gap: 22px; justify-content: center; min-width: 0; }
  .hl { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .hl .label { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
  .hl .value { font-size: 22px; line-height: 1.1; white-space: nowrap; }
  .hl .delta { font-size: 11px; }
  .hl canvas { width: 40px; height: 14px; }
  .hl-row { display: flex; align-items: center; gap: 8px; }
  #hegemony-band {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    border-left: 1px solid var(--rule);
    padding-left: 14px;
  }
  #hegemony-band.active { display: flex; }
  #hegemony-band .bar { width: 120px; height: 6px; background: var(--rule); position: relative; }
  #hegemony-band .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--warn); }
  #hegemony-band .flag { display: inline-block; width: 8px; height: 8px; margin-right: 2px; }
  #settings { display: flex; gap: 4px; }

  /* ---------- body ---------- */
  #body { display: grid; grid-template-columns: 64px 1fr 312px; overflow: hidden; }
  #rail {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
    padding: 8px 6px;
    border-right: 1px solid var(--rule);
    background: var(--paper-2);
    overflow-y: auto;
  }
  #rail button {
    height: 46px;
    padding: 2px;
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    border-color: transparent;
    color: var(--ink-2);
  }
  #rail button .glyph { font-size: 16px; line-height: 1; font-family: var(--serif); }
  #rail button:hover { border-color: var(--rule); color: var(--ink); }
  #rail button.active { border-color: var(--accent); color: var(--accent); background: var(--paper); }
  #rail .key { font-size: 9px; color: var(--ink-2); opacity: 0.7; }

  #stage { position: relative; overflow: auto; padding: 14px 18px 24px; }
  #stage canvas.chart { display: block; background: transparent; }
  .panel-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 10px; }
  .panel-title { font-family: var(--serif); font-size: 18px; margin: 0; }
  .panel-sub { font-size: 11px; color: var(--ink-2); }
  .summary-row {
    display: flex;
    gap: 26px;
    align-items: baseline;
    padding: 8px 0 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--rule);
  }
  .summary-row .stat { display: flex; flex-direction: column; gap: 1px; }
  .summary-row .stat .k { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
  .summary-row .stat .v { font-size: 20px; line-height: 1.15; }
  .summary-row .stat .v.small { font-size: 14px; }
  .summary-row .stat .d { font-size: 11px; }
  .section-title { font-family: var(--serif); font-size: 14px; margin: 16px 0 6px; display: flex; align-items: baseline; gap: 8px; }
  .section-title .spacer { flex: 1; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: start; }

  /* map */
  #map-wrap { position: relative; width: min(100%, calc((100vh - 136px) * 1.6667)); margin: 0 auto; }
  #map-wrap canvas { width: 100%; height: auto; }
  #map-legend {
    position: absolute;
    left: 8px;
    bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    background: color-mix(in srgb, var(--paper) 80%, transparent);
    padding: 6px 8px;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
  }
  #map-legend .n { display: grid; grid-template-columns: 10px 1fr auto; gap: 6px; align-items: center; }
  #map-legend .bars { display: flex; gap: 2px; align-items: flex-end; height: 10px; }
  #map-legend .bars i { display: block; width: 4px; background: currentColor; opacity: 0.85; }
  #hovercard {
    position: absolute;
    pointer-events: none;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 8px 10px;
    font-size: 11px;
    display: none;
    z-index: 10;
    min-width: 180px;
    max-width: 260px;
  }
  #hovercard .t { font-family: var(--serif); font-size: 13px; margin-bottom: 3px; }
  #hovercard .sub { color: var(--ink-2); margin-bottom: 5px; }
  #hovercard .prices { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 6px; margin-top: 5px; text-align: right; }
  #hovercard .prices .g { color: var(--ink-2); font-size: 9px; letter-spacing: 0.03em; }
  #hovercard .kv { margin-top: 3px; }

  /* curves */
  #curves-legend { display: flex; gap: 14px; margin-top: 8px; font-size: 12px; flex-wrap: wrap; }
  #curves-legend button { display: inline-flex; gap: 6px; align-items: center; }
  #curves-legend button.off { opacity: 0.4; }

  /* ---------- now column ---------- */
  #now {
    border-left: 1px solid var(--rule);
    background: var(--paper-2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #now .section { padding: 10px 12px; border-bottom: 1px solid var(--rule); }
  #now .section-h { font-size: 11px; color: var(--ink-2); margin-bottom: 6px; display: flex; align-items: baseline; gap: 8px; }
  #now .section-h .spacer { flex: 1; }
  #countdown { font-size: 12px; }
  #warning-meter { height: 4px; background: var(--rule); margin-top: 4px; }
  #warning-meter .fill { height: 100%; background: var(--warn); transition: width 300ms; }
  #queued { display: flex; flex-direction: column; gap: 6px; }
  .chip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 5px 8px;
    font-size: 12px;
  }
  .chip .l { flex: 1; min-width: 0; }
  .chip .l .sub { display: block; font-size: 11px; color: var(--ink-2); }
  .chip button { padding: 0 6px; font-size: 11px; }
  #here { max-height: 42%; overflow-y: auto; }
  #here .offers { display: flex; flex-direction: column; gap: 5px; }
  #here .offers button { justify-content: space-between; width: 100%; text-align: left; }
  #here .ground { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 10px; font-size: 12px; margin-bottom: 8px; }
  #here .ground .h { color: var(--ink-2); font-size: 10px; letter-spacing: 0.03em; }
  #here .ground .me { color: var(--accent); }
  #events { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; }
  .event-card {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 5px 8px;
    font-size: 12px;
    display: grid;
    grid-template-columns: 8px 1fr;
    gap: 7px;
    align-items: baseline;
    cursor: default;
  }
  .event-card.link { cursor: pointer; }
  .event-card.link:hover { border-color: var(--ink-2); }
  .event-dot { width: 8px; height: 8px; border-radius: 50%; }
  .event-year { color: var(--ink-2); font-size: 11px; margin-right: 6px; }
  .event-nation { color: var(--ink-2); font-size: 11px; }

  /* ---------- footer ---------- */
  #footer {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    border-top: 1px solid var(--rule);
    background: var(--paper-2);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
  }
  #footer .credits { margin-left: auto; color: var(--ink-2); font-family: var(--serif); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
  #selection .name { font-family: var(--serif); font-size: 13px; margin-right: 8px; }

  /* auto-pause ledger card */
  #autopause-card {
    position: fixed;
    top: 66px;
    right: 322px;
    width: 300px;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 12px 14px;
    z-index: 20;
    transform: translateX(130%);
    transition: transform 200ms ease-out;
  }
  #autopause-card.in { transform: translateX(0); }
  #autopause-card .title { font-size: 16px; margin-bottom: 8px; }
  #autopause-card .big-event { font-size: 13px; margin-bottom: 6px; display: grid; grid-template-columns: 8px 1fr; gap: 7px; align-items: baseline; }
  #autopause-card .hint { font-size: 11px; margin-top: 8px; }

  #gameover {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    display: none;
    z-index: 15;
    padding: 40px;
    overflow: auto;
  }
  #gameover.open { display: block; }
  #gameover h1 { font-size: 30px; margin-bottom: 6px; }
  #gameover .winner { font-family: var(--serif); font-size: 20px; margin: 10px 0; }
  #gameover .winner .n { font-size: 14px; color: var(--ink-2); font-family: var(--sans); }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div id="year-block">
      <span id="year" class="serif">1</span>
      <span id="year-label">year</span>
    </div>
    <button id="turn" title="End the year (Space or Enter)"><span class="label">End year</span><span class="glyph">▸</span><span class="hint">Space</span></button>
    <!-- clock speed controls (kept for later; the game is turn by turn)
    <div id="clock">
      <button data-speed="paused" title="Pause (space)">❚❚</button>
      <button data-speed="slow" title="Slow (1)">▸</button>
      <button data-speed="fast" title="Fast (2)">▸▸</button>
      <button data-speed="faster" title="Faster (3)">▸▸▸</button>
      <button data-speed="very_fast" title="Very fast (4)">▸▸▸▸</button>
    </div>
    -->
    <div id="headline"></div>
    <div id="hegemony-band"><span id="hegemony-text"></span><div class="bar"><div class="fill" id="hegemony-fill"></div></div></div>
    <div id="settings">
      <div id="player-block"><span id="player-name"></span><span id="player-seat"></span></div>
      <button id="new-world" class="quiet" title="Start over on another world">New world</button>
      <button id="density-toggle" class="quiet" title="Row density">Compact</button>
      <button id="theme-toggle" class="quiet" title="Day / night ledger">Night</button>
    </div>
  </header>
  <div id="body">
    <nav id="rail"></nav>
    <main id="stage"></main>
    <aside id="now">
      <div class="section" id="countdown-section" style="display:none">
        <div id="countdown"></div>
      </div>
      <div class="section">
        <div class="section-h" id="warning-section-h"><span>Warning band</span><span class="spacer"></span><span id="warning-text" class="tabular"></span></div>
        <div id="warning-meter"><div class="fill" id="warning-fill" style="width:0%"></div></div>
      </div>
      <div class="section" id="here"></div>
      <div class="section">
        <div class="section-h" id="queued-section-h"><span>Queued</span><span class="spacer"></span><span id="queued-count" class="tabular"></span></div>
        <div id="queued"></div>
      </div>
      <div id="events"></div>
    </aside>
  </div>
  <footer id="footer">
    <span id="selection">No selection</span>
    <span id="world" class="muted tabular" title="This world's seed: give it to New world to play it again"></span>
    <span class="credits">An Inquiry into the Nature and Causes of the Wealth of Nations · Lectures on Jurisprudence · The Theory of Moral Sentiments · Hunt &amp; Lautzenheiser, History of Economic Thought</span>
  </footer>
</div>
<div id="confirm"></div>
<script type="module" src="/main.js"></script>
</body>
</html>
