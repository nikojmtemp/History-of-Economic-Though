# Builds Stock for Windows and the Mac on GitHub's machines (PyInstaller cannot
# cross-build: each app is made on its own system), and publishes a Release.
#
# Push a tag like v1.1 (git tag -a v1.1 -m "..." && git push origin v1.1): the tests run,
# both apps are built, and a GitHub Release named for the tag is published with
# Stock-Setup.exe, Stock-Setup.zip and Stock.dmg attached. The README's download links
# point at the latest release, so they never need changing.
#
# "Run workflow" on the Actions tab builds without publishing: the files appear under
# the run's Artifacts (Stock-Windows, Stock-Mac).

name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . pytest httpx
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[exe]"
      - run: python scripts/build_exe.py --installer
      - uses: actions/upload-artifact@v4
        with:
          name: Stock-Windows
          path: |
            dist/Stock-Setup.exe
            dist/Stock-Setup.zip

  mac:
    needs: test
    runs-on: macos-latest  # Apple silicon (M1 and later)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[exe]"
      - run: python mac/build_mac.py
      - uses: actions/upload-artifact@v4
        with:
          name: Stock-Mac
          path: dist/Stock.dmg

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/Stock-Setup.exe out/Stock-Setup.zip out/Stock.dmg \
            --repo "$GITHUB_REPOSITORY" --title "Stock $TAG" --notes "$(cat <<'EOF'
          **Stock**: a game of Adam Smith's four stages of society.

          | Your computer | Download |
          | --- | --- |
          | Windows 10 or 11 | **Stock-Setup.exe**: run it and follow the wizard (or Stock-Setup.zip, the same installer zipped) |
          | Mac with Apple silicon (M1 or later) | **Stock.dmg**: open it and drag Stock onto Applications |

          The game opens in your web browser. It saves as you play and picks up where you left off.

          The apps are not signed by a paid certificate, so the first launch shows a warning:
          on Windows choose **More info**, then **Run anyway**; on the Mac right-click Stock, choose **Open**, then **Open** again.
          EOF
          )"
