name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt httpx

      - name: ruff
        run: ruff check . && ruff format --check stock tests tools

      - name: mypy --strict
        run: mypy stock

      - name: pytest (worldgen, verbs, invariants, pacing, API)
        run: pytest -q

      - name: balance sweep (design doc §20 targets)
        run: python -m tools.sweep --seeds 10
