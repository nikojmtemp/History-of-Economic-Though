name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: mypy --strict
        run: mypy stock

      - name: pytest (invariants, scenario tests, and the rest of the suite)
        run: pytest -q

      - name: tools smoke test (batch + sweep run headless, a tiny scenario/seed set)
        run: |
          python -m tools.batch --scenario tests/scenarios/three_bands.yaml --seeds 1 --years 20 --out /tmp/ci-runs
          python -m tools.sweep --scenario tests/scenarios/three_bands.yaml --seeds 1 --years 20 \
            --grid politics.k_lapse=5 --out /tmp/ci-sweep
